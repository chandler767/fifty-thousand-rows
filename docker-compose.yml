services:
  redpanda:
    image: redpandadata/redpanda:v24.3.6
    container_name: redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --mode=dev-container
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://127.0.0.1:9092
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - 9092:19092
      - 9644:9644

  console:
    image: redpandadata/console:v2.8.5
    container_name: redpanda-console
    depends_on:
      - redpanda
    ports:
      - 8090:8080
    environment:
      KAFKA_BROKERS: redpanda:9092
